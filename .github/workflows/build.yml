
name: Build JP Ambient

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          if [ ! -f "jp-ambient-source.zip" ]; then
            echo "::error::Fichier jp-ambient-source.zip introuvable à la racine du dépôt."
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o jp-ambient-source.zip -d source

          if [ ! -f source/settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts est introuvable dans le ZIP."
            exit 1
          fi

          if [ ! -f source/app/build.gradle.kts ]; then
            echo "::error::app/build.gradle.kts est introuvable dans le ZIP."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: source
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK="source/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK introuvable après la compilation."
            exit 1
          fi

          cp "$APK" JP-Ambient.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JP-Ambient-APK
          path: JP-Ambient.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jp-ambient-latest"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" JP-Ambient.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" JP-Ambient.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "JP Ambient Latest" \
              --notes "Version compilée automatiquement par GitHub Actions." \
              --latest
          fi
